// ================= helpers =================
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey(){ return `progress-${dateKey(new Date())}`; }
function holidayKey(){ return `holiday-${dateKey(new Date())}`; }
function dateLabel(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("bn-BD",{day:"numeric",month:"short"}); }
function daysBetween(fromIso,toDate){ const from=new Date(fromIso+"T00:00:00"); const to=new Date(dateKey(toDate)+"T00:00:00"); return Math.round((to-from)/86400000); }
function minToLabel(mins){ const h=Math.floor(mins/60), m=mins%60; const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",hour12:true}); }
function formatClock(d){ return d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}); }
function loadJSON(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ alert("সেভ করতে সমস্যা হয়েছে — স্টোরেজ ভরে গেছে হয়তো।"); } }
function timeStrToMin(str){ const [h,m] = str.split(':').map(Number); return h*60+m; }
function bnDigits(n){ const map={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'}; return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join(''); }
function uid(){ return `${Date.now()}-${Math.floor(Math.random()*10000)}`; }
function mmss(ms){ const total=Math.max(0,Math.floor(ms/1000)); const m=Math.floor(total/60); const s=total%60; return `${bnDigits(String(m).padStart(2,'0'))}:${bnDigits(String(s).padStart(2,'0'))}`; }

let focusStartTime = loadJSON("focus-start", null);
let focusBreakShown = false;
let onBreak = false;
let breakEndsAt = null;

let ringing = null;
let lastTriggered = {};
let audioCtx = null;

function playAlarm(){
  if(!state.soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const beepAt = (delay)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+delay+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+delay+0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime+delay); osc.stop(audioCtx.currentTime+delay+0.4);
    };
    [0,0.5,1.0,1.5].forEach(beepAt);
  }catch(e){ console.error(e); }
}

// ================= alarm overlay (independent of view) =================
function renderAlarmOverlay(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const nowSec = now.getSeconds();
  getTodaysBlocks().forEach(b=>{
    if(!b.alarm) return;
    const key = `${b.id}-${now.toDateString()}`;
    if(nowMin===b.start && nowSec<2 && lastTriggered[key]!==true){
      lastTriggered[key] = true;
      ringing = b;
    }
  });
  if(ringing && !ringing.__played){ ringing.__played = true; playAlarm(); }
  const el = document.getElementById("alarm-overlay");
  el.innerHTML = ringing ? `
    <div class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-sm flex flex-col items-center justify-center px-6">
      <div class="text-6xl mb-6 animate-bounce">🔔</div>
      <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mb-2">পড়ার সময় হয়েছে</p>
      <h3 class="text-3xl font-serif-bn font-semibold text-stone-50 text-center mb-2">${ringing.label}</h3>
      <p class="text-sm text-slate-400 text-center mb-8 max-w-xs">${ringing.detail}</p>
      <button onclick="dismissRing()" class="px-6 py-3 rounded-full bg-amber-400 text-slate-950 font-semibold text-sm hover:bg-amber-300 transition-colors">শুরু করছি</button>
    </div>` : '';
}
function dismissRing(){ ringing = null; renderAlarmOverlay(); }

function toggleFocus(){
  state.focusOn = !state.focusOn;
  if(state.focusOn){
    focusStartTime = Date.now();
    saveJSON("focus-start", focusStartTime);
    focusBreakShown = false;
    onBreak = false;
  } else {
    focusStartTime = null;
    saveJSON("focus-start", null);
    focusBreakShown = false;
    onBreak = false;
  }
  saveJSON("focus-on", state.focusOn);
  refreshTickAreas();
  renderFocusOverlay();
}

  breakEndsAt = null;
  focusStartTime = Date.now();
  saveJSON("focus-start", focusStartTime);
  focusBreakShown = false;

  const el = document.getElementById("focus-overlay");
  if(!state.focusOn){ el.innerHTML = ''; return; }

  if(!onBreak && focusStartTime){
    const elapsed = Date.now() - focusStartTime;

      focusBreakShown = true;
      playAlarm();
      // auto-log this completed 40-minute session into today's study hours
      const dk = dateKey(new Date());
      const current = getHours(dk) || 0;
      const updated = Math.round((current + FOCUS_DURATION_MS/3600000) * 100) / 100;
      saveJSON(studyHoursKey(dk), updated);
      if(state.view === 'hours'){ renderHoursTimer(); renderHours(); }

  }

    el.innerHTML = `

        <div class="text-6xl mb-6">🧘</div>

      </div>`;
    return;
  }

  if(onBreak){
    const remain = breakEndsAt - Date.now();
    el.innerHTML = `
      <div class="fixed inset-0 z-50 bg-emerald-950/95 backdrop-blur-sm flex flex-col items-center justify-center px-6">

      </div>`;
    if(remain <= 0){
      // auto-prompt stays visible; user taps to resume manually (kept simple/intentional)
    }
    return;
  }

  el.innerHTML = '';
}

function addNote(){
  const textarea = document.getElementById("note-draft");
  const text = textarea.value.trim();
  const fileInput = document.getElementById("note-pdf");
  const file = fileInput.files[0];
  const finish = (pdfData, pdfName) => {
    if(!text && !pdfData){ alert("লেখা অথবা পিডিএফ — অন্তত একটা দাও"); return; }
    const entry = { id: uid(), createdAt: dateKey(new Date()), text, pdfData: pdfData||null, pdfName: pdfName||null, revised:{1:false,4:false,7:false,15:false,30:false} };
    state.notes = [entry, ...state.notes];
    saveJSON("study-notes", state.notes);
    renderNotesArea();
  };
  if(file){
    if(file.size > 4*1024*1024){ alert("পিডিএফ ৪MB এর বেশি হলে ব্রাউজার স্টোরেজে জায়গা হবে না।"); return; }
    const reader = new FileReader();
    reader.onload = () => finish(reader.result, file.name);
    reader.onerror = () => alert("পিডিএফ পড়তে সমস্যা হয়েছে।");
    reader.readAsDataURL(file);
  } else { finish(null, null); }
}

function dataURLtoBlob(dataUrl){
  const [meta, base64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function openPdf(id){
  const n = state.notes.find(x => x.id === id);
  if(!n || !n.pdfData) return;
  try{
    const blob = dataURLtoBlob(n.pdfData);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){ alert("পিডিএফ খুলতে সমস্যা হয়েছে।"); }
}

const WEEKLY_TARGET_HOURS = 25;
function studyHoursKey(dk){ return `hours-${dk}`; }

function setTodayHours(){

  saveJSON(studyHoursKey(dateKey(new Date())), val);
  renderHours();

function weekDates(refDate){
  // BD-style week: Saturday -> Friday
  const dow = refDate.getDay(); // 0=Sun..6=Sat
  const sinceSat = (dow - 6 + 7) % 7;
  const start = new Date(refDate);
  start.setDate(refDate.getDate() - sinceSat);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    days.push(d);
  }
  return days;
}

// ================= math: stopwatch + focus countdown + chapter log =================
let swRunning = false;
let swElapsedMs = 0;
let swStartTs = null;
let swSessionBaseHours = null;
function formatDuration(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  const pad = n => bnDigits(String(n).padStart(2,'0'));
  return h>0 ? `${bnDigits(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function swToggle(){
  if(swRunning){
    swElapsedMs += Date.now() - swStartTs;
    swRunning = false;
    // auto-add this session's time to today's study hours
    const dk = dateKey(new Date());
    const base = swSessionBaseHours !== null ? swSessionBaseHours : (getHours(dk) || 0);
    const finalHours = Math.round((base + swElapsedMs/3600000) * 100) / 100;
    saveJSON(studyHoursKey(dk), finalHours);
    swElapsedMs = 0;
    swSessionBaseHours = null;
  } else {
    swStartTs = Date.now();
    swRunning = true;
    swSessionBaseHours = getHours(dateKey(new Date())) || 0;
  }
  renderHoursTimer();
  renderHours();
}
function swReset(){
  swRunning = false;
  swElapsedMs = 0;
  swStartTs = null;
  swSessionBaseHours = null;
  renderHoursTimer();
}
function saveMathLog(){ saveJSON("math-log", state.mathLog); }
function useStopwatchMinutes(){
  const current = swRunning ? swElapsedMs + (Date.now()-swStartTs) : swElapsedMs;
  const mins = Math.round(current/60000);
  document.getElementById('math-minutes').value = mins;
}
function addMathEntry(){
  const chapterInput = document.getElementById('math-chapter');
  const notesInput = document.getElementById('math-notes');
  const minutesInput = document.getElementById('math-minutes');
  const chapter = chapterInput.value.trim();
  const notes = notesInput.value.trim();

  if(!chapter){ alert("কোন চ্যাপ্টার/টাইপ পড়লে সেটা লেখো"); return; }
  const entry = { id: uid(), createdAt: dateKey(new Date()), chapter, notes, minutes: isNaN(minutes) ? null : minutes };
  state.mathLog = [entry, ...state.mathLog];
  saveMathLog();
  chapterInput.value = '';
  notesInput.value = '';
  minutesInput.value = '';
  renderMathLog();
}

}

let mathCountdownRunning = false;
let mathCountdownEndsAt = null;
let mathCountdownFinished = false;
const MATH_COUNTDOWN_MS = 60*60*1000; // 1 hour
function startMathCountdown(){
  mathCountdownRunning = true;

  mathCountdownEndsAt = Date.now() + MATH_COUNTDOWN_MS;

function renderMathTimer(){
  const el = document.getElementById("math-timer-area");

  let remainMs = MATH_COUNTDOWN_MS;

      mathCountdownRunning = false;
      mathCountdownFinished = true;

function getTodaysBlocks(){
  const pair = PAIRS_BY_WEEKDAY[new Date().getDay()];
  let blocks = BLOCKS.map(b => {
    if(b.id === 'eve-subject1') return { ...b, label: pair.a, detail: `★★★ আগে ধরো` };
    if(b.id === 'eve-subject2') return { ...b, label: pair.b, detail: `★★★ আগে ধরো` };
    return b;
  });

  // Carve out a Maghrib prayer break wherever it lands, using the times set
  // on the নামাজ page — since Maghrib shifts through the year, this stays
  // accurate as long as that's kept up to date.
  const maghribStart = timeStrToMin(state.prayerTimes.maghrib.start);
  const MAGHRIB_LEN = 15;
  const maghribEnd = maghribStart + MAGHRIB_LEN;
  const hostIdx = blocks.findIndex(b => (b.id === 'eve-subject1' || b.id === 'eve-subject2') && maghribStart >= b.start && maghribStart < b.end);
  if(hostIdx !== -1){
    const host = blocks[hostIdx];
    const part1 = { ...host, end: maghribStart };
    const prayerBreak = { id: 'maghrib-break', start: maghribStart, end: maghribEnd, label: 'মাগরিবের নামাজ', detail: '১৫ মিনিট', alarm: false, tone: 'rest' };
    const part2 = { ...host, id: host.id + '-b', start: maghribEnd, label: host.label + ' (বাকি অংশ)' };
    blocks = [...blocks.slice(0, hostIdx), part1, prayerBreak, part2, ...blocks.slice(hostIdx+1)];
  }
  return blocks;
}

// ================= render: PROGRESS REPORT =================
function renderProgress(){
  const el = document.getElementById("progress-area");
  const now = new Date();

  // syllabus stats: overall + star-weighted readiness + per-subject
  let totalSub = 0, doneSub = 0, totalWeight = 0, doneWeight = 0;
  const perSubject = state.syllabus.map(subj => {
    let sTotal = 0, sDone = 0, sWeight = 0, sDoneWeight = 0;
    subj.topics.forEach(t => t.subtopics.forEach(st => {
      sTotal++; sWeight += (st.importance || 1);
      if(st.done){ sDone++; sDoneWeight += (st.importance || 1); }
    }));
    totalSub += sTotal; doneSub += sDone; totalWeight += sWeight; doneWeight += sDoneWeight;
    return { name: subj.name, total: sTotal, done: sDone, pct: sTotal ? Math.round((sDone/sTotal)*100) : 0 };
  });
  const readinessPct = totalWeight ? Math.round((doneWeight/totalWeight)*100) : 0;
  const overallPct = totalSub ? Math.round((doneSub/totalSub)*100) : 0;

  // revision stats: how many checkpoints completed vs how many have come due so far
  let revisionDue = 0, revisionDone = 0;
  const allRevisable = [
    ...state.notes.map(n => ({ createdAt: n.createdAt, revised: n.revised })),
    ...state.syllabus.flatMap(s => s.topics.flatMap(t => t.subtopics.filter(st => st.completedAt).map(st => ({ createdAt: st.completedAt, revised: st.revised })))),
  ];
  allRevisable.forEach(item => {
    const diff = daysBetween(item.createdAt, now);
    REVISION_OFFSETS.forEach(offset => {
      if(diff >= offset){
        revisionDue++;
        if(item.revised[offset]) revisionDone++;
      }
    });
  });
  const revisionPct = revisionDue ? Math.round((revisionDone/revisionDue)*100) : 100;

  // weekly hours
  const days = weekDates(now);

// ================= render: CALENDAR =================
function renderCalendar(){
  const el = document.getElementById("calendar-area");
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const todayDate = now.getDate();

  let nextJan1 = new Date(year+1, 0, 1);
  if(now.getMonth()===0 && now.getDate()===1) nextJan1 = new Date(year, 0, 1);
  const msPerDay = 86400000;
  const startOfToday = new Date(year, now.getMonth(), now.getDate());
  const daysLeft = Math.round((nextJan1 - startOfToday) / msPerDay);

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = now.toLocaleDateString("bn-BD", { month: "long", year: "numeric" });
  const weekdayLabels = ["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"];

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d === todayDate;
    const isPast = d < todayDate;
    cells += `
      <div class="aspect-square rounded-lg flex flex-col items-center justify-center text-xs relative ${isToday ? 'bg-amber-400 text-slate-950 font-bold' : isPast ? 'bg-slate-900/40 text-slate-600' : 'bg-slate-900/20 text-slate-300'}">
        ${isPast ? '<span class="absolute inset-0 flex items-center justify-center text-rose-500/70 text-lg">✗</span>' : ''}
        <span class="${isPast ? 'opacity-30' : ''}">${bnDigits(d)}</span>
      </div>`;
  }

  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('main')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6 rounded-2xl border border-violet-500/30 bg-violet-500/5 p-5">
      <p class="text-xs text-slate-500 mb-1">১লা জানুয়ারি পর্যন্ত</p>
      <p class="text-3xl font-serif-bn font-bold text-violet-300">আর মাত্র ${bnDigits(daysLeft)} দিন বাকি</p>
    </div>
    <div class="w-full max-w-xl mb-3 text-center">
      <p class="text-sm text-slate-400">${monthName}</p>
    </div>
    <div class="w-full max-w-xl grid grid-cols-7 gap-1.5 mb-2">
      ${weekdayLabels.map(w=>`<div class="text-center text-[10px] text-slate-600 mb-1">${w}</div>`).join("")}
      ${cells}
    </div>
    <p class="text-[11px] text-slate-600 mt-4 text-center max-w-xs">যে তারিখগুলো পার হয়ে গেছে সেখানে ✗ চিহ্ন বসে গেছে — এটা প্রতিদিন নিজে থেকেই আপডেট হয়।</p>
  `;
}

// ================= render: SYLLABUS =================
function renderSyllabus(){
  const el = document.getElementById("syllabus-area");
  const due = getSyllabusDueToday();
  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('main')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-[11px] text-slate-500">📚 সিলেবাস</p>
      <p class="text-[10px] text-slate-600 mt-1"><span class="text-amber-400">★★★</span> সবচেয়ে গুরুত্বপূর্ণ · <span class="text-amber-400">★★</span> মাঝারি · <span class="text-amber-400">★</span> কম গুরুত্বপূর্ণ · স্টার নেই = সিলেবাসে আছে কিন্তু প্রশ্ন-বিশ্লেষণে স্পষ্ট প্রমাণ পাইনি (আনুমানিক রেটিং)</p>
    </div>

    <div class="w-full max-w-xl mb-8">
      <p class="uppercase tracking-[0.25em] text-[11px] text-slate-500 mb-3">আজকে যেটা পড়বো (রিভিশন — ১-৪-৭-১৫-৩০ রুল)</p>
      ${due.length===0 ? `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4 text-center text-xs text-slate-600">আজ সিলেবাস রিভিশনের কিছু বাকি নেই</div>` :
        `<div class="space-y-2">
          ${due.map(d => `
            <div class="flex items-start gap-3 rounded-xl px-4 py-3 border border-emerald-500/30 bg-emerald-500/5">
              <button onclick="markSubtopicRevised('${d.subjectId}','${d.topicId}','${d.subtopicId}',${d.offset})" class="shrink-0 mt-0.5 text-lg">⚪</button>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-0.5">
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 font-semibold">Day ${d.offset}</span>
                  <span class="text-[11px] text-slate-500">${d.subjectName} · ${d.topicName}</span>
                </div>
                <p class="text-sm text-stone-200">${d.subtopicName}</p>
              </div>
            </div>`).join("")}
        </div>`}
    </div>

    <div class="w-full max-w-xl mb-4">
      <p class="uppercase tracking-[0.25em] text-[11px] text-slate-500 mb-3">সাবজেক্ট</p>
      <div class="space-y-2">
        ${state.syllabus.map(subj => {
          const totalSub = subj.topics.reduce((a,t)=>a+t.subtopics.length,0);
          const doneSub = subj.topics.reduce((a,t)=>a+t.subtopics.filter(s=>s.done).length,0);
          return `
          <div class="flex items-center gap-3 rounded-xl px-4 py-3 border border-slate-800/80 bg-slate-900/20">
            <button onclick="openSubject('${subj.id}')" class="flex-1 text-left min-w-0">
              <p class="text-sm font-medium text-stone-200 truncate">${subj.name}</p>
              <p class="text-xs text-slate-500">${subj.topics.length} টপিক · ${bnDigits(doneSub)}/${bnDigits(totalSub)} সাব-টপিক শেষ</p>
            </button>
            <button onclick="deleteSubject('${subj.id}')" class="text-slate-600 hover:text-rose-400 text-xs shrink-0">🗑</button>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="w-full max-w-xl mb-8">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4 flex items-center gap-2">
        <input id="new-subject-name" type="text" placeholder="নতুন সাবজেক্টের নাম (যেমন: বাংলা)" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none" />
        <button onclick="addSubject()" class="px-4 py-2 rounded-full bg-emerald-500 text-slate-950 text-xs font-semibold hover:bg-emerald-400 transition-colors">＋ যোগ</button>
      </div>
    </div>
  `;
}

// ================= render: SUBJECT =================
function renderSubject(){
  const el = document.getElementById("syllabus-area");
  const subj = getSubject(state.currentSubjectId);
  if(!subj){ switchView('syllabus'); return; }

  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('syllabus')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← সিলেবাসে ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-[11px] text-slate-500">${subj.name}</p>
    </div>

    <div class="w-full max-w-xl space-y-4 mb-6">
      ${subj.topics.length===0 ? `<div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4 text-center text-xs text-slate-600">এখনো কোনো টপিক নেই</div>` :
      subj.topics.map(topic => `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4">
          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-semibold text-amber-300">${topic.name}</p>
            <button onclick="deleteTopic('${subj.id}','${topic.id}')" class="text-slate-600 hover:text-rose-400 text-xs">🗑</button>
          </div>
          <div class="space-y-2 mb-3">
            ${topic.subtopics.length===0 ? `<p class="text-xs text-slate-600">এখনো সাব-টপিক নেই</p>` :
            topic.subtopics.map(st => `
              <div class="flex items-start gap-2 rounded-lg px-3 py-2 bg-slate-950/40">
                <button onclick="toggleSubtopicDone('${subj.id}','${topic.id}','${st.id}')" class="shrink-0 text-base mt-0.5">${st.done ? '✅' : '⚪'}</button>
                <div class="flex-1 min-w-0">
                  <p class="text-sm ${st.done ? 'text-stone-300' : 'text-stone-200'}">${st.name} ${st.importance ? `<span class="text-amber-400">${'★'.repeat(st.importance)}</span>` : ''}</p>
                  ${st.completedAt ? `
                    <div class="flex items-center gap-1 mt-1">
                      <span class="text-[9px] text-slate-600">${dateLabel(st.completedAt)} শেষ</span>
                      ${REVISION_OFFSETS.map(o=>`<span class="text-[9px] px-1.5 py-0.5 rounded-full font-semibold ${st.revised[o] ? 'bg-emerald-500/20 text-emerald-400':'bg-slate-800 text-slate-600'}">D${o}</span>`).join("")}
                    </div>` : ''}
                </div>
                <button onclick="deleteSubtopic('${subj.id}','${topic.id}','${st.id}')" class="text-slate-700 hover:text-rose-400 text-xs shrink-0">🗑</button>
              </div>`).join("")}
          </div>
          <div class="flex items-center gap-2">
            <input id="new-subtopic-${topic.id}" type="text" placeholder="নতুন সাব-টপিক" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-stone-200 placeholder-slate-600 outline-none" />
            <button onclick="addSubtopic('${subj.id}','${topic.id}')" class="px-3 py-1.5 rounded-full bg-slate-700 text-stone-200 text-xs hover:bg-slate-600 transition-colors">＋</button>
          </div>
        </div>`).join("")}
    </div>

    <div class="w-full max-w-xl mb-8">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4 flex items-center gap-2">
        <input id="new-topic-name" type="text" placeholder="নতুন টপিকের নাম" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none" />
        <button onclick="addTopic('${subj.id}')" class="px-4 py-2 rounded-full bg-amber-400 text-slate-950 text-xs font-semibold hover:bg-amber-300 transition-colors">＋ টপিক যোগ</button>
      </div>
    </div>
  `;
}

// ================= render: DUA =================
function renderDua(){
  const el = document.getElementById("dua-area");
  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('main')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-[11px] text-slate-500">🤲 দোয়ার তালিকা</p>
    </div>

    <div class="w-full max-w-xl space-y-3 mb-6">
      ${state.duas.length===0 ? `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4 text-center text-xs text-slate-600">এখনো কোনো দোয়া যোগ করা হয়নি — নিচ থেকে যোগ করো</div>` :
        state.duas.map(d => `
          <div class="rounded-2xl border border-rose-500/20 bg-rose-500/5 p-4">
            <div class="flex items-start justify-between gap-2 mb-2">
              <p class="text-sm font-semibold text-rose-300">${d.title}</p>
              <button onclick="deleteDua('${d.id}')" class="text-slate-600 hover:text-rose-400 text-xs shrink-0">🗑</button>
            </div>
            <p class="text-sm text-stone-200 whitespace-pre-line leading-relaxed">${d.text}</p>
          </div>`).join("")}
    </div>

    <div class="w-full max-w-xl mb-8">
      <p class="text-xs text-slate-500 mb-3">নতুন দোয়া যোগ করো</p>
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
        <input id="new-dua-title" type="text" placeholder="দোয়ার শিরোনাম (যেমন: মৃত ব্যক্তির জন্য দোয়া)" class="w-full bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none mb-2" />
        <textarea id="new-dua-text" placeholder="পুরো দোয়ার লেখা এখানে টাইপ করো..." rows="4" class="w-full bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none resize-none mb-3"></textarea>
        <button onclick="addDua()" class="w-full py-2.5 rounded-full bg-rose-400 text-slate-950 text-sm font-semibold hover:bg-rose-300 transition-colors">＋ দোয়া যোগ করো</button>
      </div>
    </div>
  `;
}

// ================= init =================
switchView('main');
renderAlarmOverlay();
renderFocusOverlay();

setInterval(() => {
  renderAlarmOverlay();
  renderFocusOverlay();
  refreshTickAreas();
}, 1000);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
