<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BCS স্টাডি ক্লক</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#020617" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Noto Sans Bengali', system-ui, sans-serif; }
  .font-serif-bn { font-family: 'Noto Serif Bengali', Georgia, serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-stone-100">
<div class="flex flex-col items-center px-4 py-8 relative overflow-hidden min-h-screen">
  <div class="pointer-events-none absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full bg-amber-500/5 blur-3xl"></div>

  <div class="w-full max-w-xl flex items-center justify-between mb-2 relative z-10">
    <p class="uppercase tracking-[0.25em] text-[9px] text-slate-600">BCS প্রস্তুতি</p>
  </div>

  <div class="absolute top-6 right-6 md:top-10 md:right-10 select-none" style="transform: rotate(-12deg);">
    <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-rose-500/70 flex items-center justify-center text-center p-2 opacity-70">
      <span class="text-[10px] md:text-xs font-bold text-rose-400 leading-tight tracking-wide">শুধু<br/>অধ্যয়নের<br/>জন্য</span>
    </div>
  </div>

  <div id="live-area" class="w-full flex flex-col items-center relative z-10"></div>
  <div id="notes-area" class="w-full flex flex-col items-center relative z-10"></div>
  <div id="holiday-area" class="w-full flex flex-col items-center relative z-10"></div>
  <div id="calendar-area" class="w-full flex flex-col items-center relative z-10"></div>
  <div id="syllabus-area" class="w-full flex flex-col items-center relative z-10"></div>
  <div id="dua-area" class="w-full flex flex-col items-center relative z-10"></div>

  <p id="footer-note" class="text-[11px] text-slate-600 mb-8 text-center max-w-xs relative z-10"></p>

  <div id="alarm-overlay"></div>
  <div id="focus-overlay"></div>
</div>

<script>
// ================= Schedule data =================
const toMin = (h, m) => h * 60 + m;
const BLOCKS = [
  { id: "morning", start: toMin(6,0), end: toMin(7,30), label: "ভারী পড়া", detail: "নতুন টপিক · বাংলাদেশ ও আন্তর্জাতিক বিষয়াবলি", alarm: true, tone: "primary" },
  { id: "commute-am", start: toMin(7,30), end: toMin(8,30), label: "অফিসের প্রস্তুতি ও যাতায়াত", detail: "পড়া বন্ধ — এই সময় বিশ্রাম", alarm: false, tone: "rest" },
  { id: "office-am", start: toMin(8,30), end: toMin(12,0), label: "অফিস", detail: "ফাঁকা সময় পেলে: MCQ practice / vocabulary", alarm: false, tone: "office" },
  { id: "lunch", start: toMin(12,0), end: toMin(12,30), label: "লাঞ্চ স্টাডি", detail: "ভোকাবুলারি / বাগধারা / current affairs", alarm: true, tone: "primary" },
  { id: "office-pm", start: toMin(12,30), end: toMin(18,0), label: "অফিস", detail: "ফাঁকা সময় পেলে: হালকা রিভিশন", alarm: false, tone: "office" },
  { id: "rest-eve", start: toMin(18,0), end: toMin(20,0), label: "যাতায়াত ও বিশ্রাম", detail: "রিচার্জ — এই সময় পড়ার দরকার নেই", alarm: false, tone: "rest" },
  { id: "evening", start: toMin(20,0), end: toMin(22,0), label: "মূল স্টাডি ব্লক", detail: "লেখা প্র্যাকটিস / নোট / mock question", alarm: true, tone: "primary" },
];
const TONE = {
  primary: { ring:"ring-amber-400/60", bg:"bg-amber-400/10", text:"text-amber-300", dot:"bg-amber-400" },
  rest:    { ring:"ring-slate-600/40", bg:"bg-slate-800/40", text:"text-slate-400", dot:"bg-slate-600" },
  office:  { ring:"ring-sky-500/30",   bg:"bg-sky-500/5",    text:"text-sky-300",   dot:"bg-sky-500" },
};
const REVISION_OFFSETS = [1,4,7];
const FOCUS_DURATION_MS = 40*60*1000;

// ================= helpers =================
function dateKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey(){ return `progress-${dateKey(new Date())}`; }
function holidayKey(){ return `holiday-${dateKey(new Date())}`; }
function dateLabel(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("bn-BD",{day:"numeric",month:"short"}); }
function daysBetween(fromIso,toDate){ const from=new Date(fromIso+"T00:00:00"); const to=new Date(dateKey(toDate)+"T00:00:00"); return Math.round((to-from)/86400000); }
function minToLabel(mins){ const h=Math.floor(mins/60), m=mins%60; const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",hour12:true}); }
function formatClock(d){ return d.toLocaleTimeString("bn-BD",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}); }
function loadJSON(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ alert("সেভ করতে সমস্যা হয়েছে — স্টোরেজ ভরে গেছে হয়তো।"); } }
function timeStrToMin(str){ const [h,m] = str.split(':').map(Number); return h*60+m; }
function bnDigits(n){ const map={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'}; return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join(''); }
function uid(){ return `${Date.now()}-${Math.floor(Math.random()*10000)}`; }
function mmss(ms){ const total=Math.max(0,Math.floor(ms/1000)); const m=Math.floor(total/60); const s=total%60; return `${bnDigits(String(m).padStart(2,'0'))}:${bnDigits(String(s).padStart(2,'0'))}`; }

// ================= seed syllabus =================
const SEED_SYLLABUS = [
  {
    id: uid(),
    name: "বাংলাদেশ বিষয়াবলি",
    topics: [
      {
        id: uid(),
        name: "বাংলাদেশের কৃষিসম্পদ",
        subtopics: [
          { id: uid(), name: "কৃষি বিষয়ক প্রতিবেদন", done:false, completedAt:null, revised:{1:false,4:false,7:false} },
          { id: uid(), name: "অর্থকরী ফসল, কৃষি ভিত্তিক প্রতিষ্ঠান", done:false, completedAt:null, revised:{1:false,4:false,7:false} },
          { id: uid(), name: "কৃষিপণ্য, কৃষিজ ফসল ও GI পণ্য", done:false, completedAt:null, revised:{1:false,4:false,7:false} },
          { id: uid(), name: "বাংলাদেশের মৎস্য ও প্রাণী সম্পদ", done:false, completedAt:null, revised:{1:false,4:false,7:false} },
        ]
      }
    ]
  }
];

// ================= state =================
let state = {
  view: 'main', // main | holiday | calendar | syllabus | subject | dua
  currentSubjectId: null,
  done: loadJSON(todayKey(), {}),
  notes: loadJSON("study-notes", []),
  soundOn: loadJSON("sound-on", true),
  historyOpen: false,
  holidayRanges: loadJSON(holidayKey(), []),
  syllabus: loadJSON("syllabus", null) || SEED_SYLLABUS,
  duas: loadJSON("duas", []),
  focusOn: loadJSON("focus-on", false),
};
if(!loadJSON("syllabus", null)) saveJSON("syllabus", state.syllabus);

let focusStartTime = loadJSON("focus-start", null);
let focusBreakShown = false;
let onBreak = false;
let breakEndsAt = null;

let ringing = null;
let lastTriggered = {};
let audioCtx = null;

function playAlarm(){
  if(!state.soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const beepAt = (delay)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+delay+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+delay+0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime+delay); osc.stop(audioCtx.currentTime+delay+0.4);
    };
    [0,0.5,1.0,1.5].forEach(beepAt);
  }catch(e){ console.error(e); }
}

// ================= alarm overlay (independent of view) =================
function renderAlarmOverlay(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const nowSec = now.getSeconds();
  BLOCKS.forEach(b=>{
    if(!b.alarm) return;
    const key = `${b.id}-${now.toDateString()}`;
    if(nowMin===b.start && nowSec<2 && lastTriggered[key]!==true){
      lastTriggered[key] = true;
      ringing = b;
    }
  });
  if(ringing && !ringing.__played){ ringing.__played = true; playAlarm(); }
  const el = document.getElementById("alarm-overlay");
  el.innerHTML = ringing ? `
    <div class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-sm flex flex-col items-center justify-center px-6">
      <div class="text-6xl mb-6 animate-bounce">🔔</div>
      <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mb-2">পড়ার সময় হয়েছে</p>
      <h3 class="text-3xl font-serif-bn font-semibold text-stone-50 text-center mb-2">${ringing.label}</h3>
      <p class="text-sm text-slate-400 text-center mb-8 max-w-xs">${ringing.detail}</p>
      <button onclick="dismissRing()" class="px-6 py-3 rounded-full bg-amber-400 text-slate-950 font-semibold text-sm hover:bg-amber-300 transition-colors">শুরু করছি</button>
    </div>` : '';
}
function dismissRing(){ ringing = null; renderAlarmOverlay(); }

// ================= focus mode =================
function toggleFocus(){
  state.focusOn = !state.focusOn;
  if(state.focusOn){
    focusStartTime = Date.now();
    saveJSON("focus-start", focusStartTime);
    focusBreakShown = false;
    onBreak = false;
  } else {
    focusStartTime = null;
    saveJSON("focus-start", null);
    focusBreakShown = false;
    onBreak = false;
  }
  saveJSON("focus-on", state.focusOn);
  renderMain();
  renderFocusOverlay();
}
function startBreakNow(){
  onBreak = true;
  breakEndsAt = Date.now() + 5*60*1000;
  renderFocusOverlay();
}
function endBreakAndResume(){
  onBreak = false;
  breakEndsAt = null;
  focusStartTime = Date.now();
  saveJSON("focus-start", focusStartTime);
  focusBreakShown = false;
  renderFocusOverlay();
}
function renderFocusOverlay(){
  const el = document.getElementById("focus-overlay");
  if(!state.focusOn){ el.innerHTML = ''; return; }

  if(!onBreak && focusStartTime){
    const elapsed = Date.now() - focusStartTime;
    if(elapsed >= FOCUS_DURATION_MS && !focusBreakShown){
      focusBreakShown = true;
      playAlarm();
    }
  }

  if(focusBreakShown && !onBreak){
    el.innerHTML = `
      <div class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-sm flex flex-col items-center justify-center px-6">
        <div class="text-6xl mb-6">🧘</div>
        <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mb-2">ফোকাস মোড</p>
        <h3 class="text-2xl font-serif-bn font-semibold text-stone-50 text-center mb-2">৪০ মিনিট হয়ে গেছে</h3>
        <p class="text-sm text-slate-400 text-center mb-8 max-w-xs">৫ মিনিটের একটা ছোট বিরতি নাও — চোখ বিশ্রাম দাও, পানি খাও।</p>
        <button onclick="startBreakNow()" class="px-6 py-3 rounded-full bg-amber-400 text-slate-950 font-semibold text-sm hover:bg-amber-300 transition-colors">৫ মিনিটের বিরতি শুরু</button>
      </div>`;
    return;
  }

  if(onBreak){
    const remain = breakEndsAt - Date.now();
    el.innerHTML = `
      <div class="fixed inset-0 z-50 bg-emerald-950/95 backdrop-blur-sm flex flex-col items-center justify-center px-6">
        <div class="text-6xl mb-6">☕</div>
        <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mb-2">বিরতি চলছে</p>
        <div class="font-mono text-4xl tabular-nums text-emerald-300 mb-6">${mmss(Math.max(0,remain))}</div>
        <button onclick="endBreakAndResume()" class="px-6 py-3 rounded-full bg-emerald-400 text-slate-950 font-semibold text-sm hover:bg-emerald-300 transition-colors">বিরতি শেষ, আবার শুরু করি</button>
      </div>`;
    if(remain <= 0){
      // auto-prompt stays visible; user taps to resume manually (kept simple/intentional)
    }
    return;
  }

  el.innerHTML = '';
}

// ================= view switching =================
function clearAllAreas(){
  ['live-area','notes-area','holiday-area','calendar-area','syllabus-area','dua-area'].forEach(id=>{
    document.getElementById(id).innerHTML = '';
  });
}
function switchView(v, subjectId){
  state.view = v;
  state.currentSubjectId = subjectId || null;
  clearAllAreas();
  if(v === 'main'){ renderMain(); renderNotesArea(); }
  else if(v === 'holiday'){ renderHoliday(); }
  else if(v === 'calendar'){ renderCalendar(); }
  else if(v === 'syllabus'){ renderSyllabus(); }
  else if(v === 'subject'){ renderSubject(); }
  else if(v === 'dua'){ renderDua(); }

  const notes = {
    main: 'এই পেজ খোলা থাকলে নির্ধারিত সময়ে শব্দ বাজবে। নোট, পিডিএফ ও রিভিশন তথ্য এই ব্রাউজারেই সেভ থাকে।',
    holiday: 'ছুটির দিনের রুটিন আলাদাভাবে এই ব্রাউজারেই সেভ থাকে।',
    calendar: 'ক্যালেন্ডার আজকের তারিখ অনুযায়ী নিজে থেকেই আপডেট হয়।',
    syllabus: 'সিলেবাসের অগ্রগতি এই ব্রাউজারেই সেভ থাকে।',
    subject: 'সিলেবাসের অগ্রগতি এই ব্রাউজারেই সেভ থাকে।',
    dua: 'দোয়াগুলো এই ব্রাউজারেই সেভ থাকে।',
  };
  document.getElementById('footer-note').textContent = notes[v] || '';
}

// ================= actions: schedule =================
function toggleDone(id){
  state.done = { ...state.done, [id]: !state.done[id] };
  saveJSON(todayKey(), state.done);
  renderMain();
}
function toggleSound(){
  state.soundOn = !state.soundOn;
  saveJSON("sound-on", state.soundOn);
  renderMain();
}

// ================= actions: notes =================
function addNote(){
  const textarea = document.getElementById("note-draft");
  const text = textarea.value.trim();
  const fileInput = document.getElementById("note-pdf");
  const file = fileInput.files[0];
  const finish = (pdfData, pdfName) => {
    if(!text && !pdfData){ alert("লেখা অথবা পিডিএফ — অন্তত একটা দাও"); return; }
    const entry = { id: uid(), createdAt: dateKey(new Date()), text, pdfData: pdfData||null, pdfName: pdfName||null, revised:{1:false,4:false,7:false} };
    state.notes = [entry, ...state.notes];
    saveJSON("study-notes", state.notes);
    renderNotesArea();
  };
  if(file){
    if(file.size > 4*1024*1024){ alert("পিডিএফ ৪MB এর বেশি হলে ব্রাউজার স্টোরেজে জায়গা হবে না।"); return; }
    const reader = new FileReader();
    reader.onload = () => finish(reader.result, file.name);
    reader.onerror = () => alert("পিডিএফ পড়তে সমস্যা হয়েছে।");
    reader.readAsDataURL(file);
  } else { finish(null, null); }
}
function markRevised(id, offset){
  state.notes = state.notes.map(n => n.id===id ? {...n, revised:{...n.revised, [offset]: true}} : n);
  saveJSON("study-notes", state.notes);
  renderNotesArea();
}
function deleteNote(id){
  if(!confirm("এই নোটটা মুছে ফেলবে?")) return;
  state.notes = state.notes.filter(n => n.id !== id);
  saveJSON("study-notes", state.notes);
  renderNotesArea();
}
function toggleHistory(){ state.historyOpen = !state.historyOpen; renderNotesArea(); }
function onPdfChosen(){
  const fileInput = document.getElementById("note-pdf");
  const label = document.getElementById("pdf-file-label");
  if(fileInput.files[0]) label.textContent = "📎 " + fileInput.files[0].name;
}
function dataURLtoBlob(dataUrl){
  const [meta, base64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
function openPdf(id){
  const n = state.notes.find(x => x.id === id);
  if(!n || !n.pdfData) return;
  try{
    const blob = dataURLtoBlob(n.pdfData);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  }catch(e){ alert("পিডিএফ খুলতে সমস্যা হয়েছে।"); }
}

// ================= actions: holiday ranges =================
function addHolidayRange(){
  const start = document.getElementById('holiday-start').value;
  const end = document.getElementById('holiday-end').value;
  const text = document.getElementById('holiday-topic').value.trim();
  if(!start || !end){ alert("শুরু আর শেষ সময় দুটোই দাও"); return; }
  if(timeStrToMin(end) <= timeStrToMin(start)){ alert("শেষ সময়টা শুরুর পরে হতে হবে"); return; }
  if(!text){ alert("এই সময়ে কী পড়বে সেটা লেখো"); return; }
  const entry = { id: uid(), start, end, text };
  state.holidayRanges = [...state.holidayRanges, entry].sort((a,b)=>timeStrToMin(a.start)-timeStrToMin(b.start));
  saveJSON(holidayKey(), state.holidayRanges);
  renderHoliday();
}
function deleteHolidayRange(id){
  state.holidayRanges = state.holidayRanges.filter(r => r.id !== id);
  saveJSON(holidayKey(), state.holidayRanges);
  renderHoliday();
}

// ================= actions: syllabus =================
function saveSyllabus(){ saveJSON("syllabus", state.syllabus); }
function addSubject(){
  const input = document.getElementById('new-subject-name');
  const name = input.value.trim();
  if(!name) return;
  state.syllabus.push({ id: uid(), name, topics: [] });
  saveSyllabus();
  input.value = '';
  renderSyllabus();
}
function deleteSubject(id){
  if(!confirm("পুরো সাবজেক্টটা মুছে ফেলবে?")) return;
  state.syllabus = state.syllabus.filter(s => s.id !== id);
  saveSyllabus();
  renderSyllabus();
}
function openSubject(id){ switchView('subject', id); }
function getSubject(id){ return state.syllabus.find(s => s.id === id); }
function addTopic(subjectId){
  const input = document.getElementById('new-topic-name');
  const name = input.value.trim();
  if(!name) return;
  const subj = getSubject(subjectId);
  subj.topics.push({ id: uid(), name, subtopics: [] });
  saveSyllabus();
  input.value = '';
  renderSubject();
}
function deleteTopic(subjectId, topicId){
  if(!confirm("টপিকটা মুছে ফেলবে?")) return;
  const subj = getSubject(subjectId);
  subj.topics = subj.topics.filter(t => t.id !== topicId);
  saveSyllabus();
  renderSubject();
}
function addSubtopic(subjectId, topicId){
  const input = document.getElementById(`new-subtopic-${topicId}`);
  const name = input.value.trim();
  if(!name) return;
  const subj = getSubject(subjectId);
  const topic = subj.topics.find(t => t.id === topicId);
  topic.subtopics.push({ id: uid(), name, done:false, completedAt:null, revised:{1:false,4:false,7:false} });
  saveSyllabus();
  input.value = '';
  renderSubject();
}
function deleteSubtopic(subjectId, topicId, subtopicId){
  const subj = getSubject(subjectId);
  const topic = subj.topics.find(t => t.id === topicId);
  topic.subtopics = topic.subtopics.filter(st => st.id !== subtopicId);
  saveSyllabus();
  renderSubject();
}
function toggleSubtopicDone(subjectId, topicId, subtopicId){
  const subj = getSubject(subjectId);
  const topic = subj.topics.find(t => t.id === topicId);
  const st = topic.subtopics.find(s => s.id === subtopicId);
  st.done = !st.done;
  if(st.done && !st.completedAt){
    st.completedAt = dateKey(new Date());
    st.revised = {1:false,4:false,7:false};
  }
  saveSyllabus();
  renderSubject();
}
function markSubtopicRevised(subjectId, topicId, subtopicId, offset){
  const subj = getSubject(subjectId);
  const topic = subj.topics.find(t => t.id === topicId);
  const st = topic.subtopics.find(s => s.id === subtopicId);
  st.revised[offset] = true;
  saveSyllabus();
  renderSyllabus();
  renderSubject();
}
function getSyllabusDueToday(){
  const now = new Date();
  const due = [];
  state.syllabus.forEach(subj => {
    subj.topics.forEach(topic => {
      topic.subtopics.forEach(st => {
        if(!st.completedAt) return;
        const diff = daysBetween(st.completedAt, now);
        REVISION_OFFSETS.forEach(offset => {
          if(diff === offset && !st.revised[offset]){
            due.push({ subjectId: subj.id, subjectName: subj.name, topicId: topic.id, topicName: topic.name, subtopicId: st.id, subtopicName: st.name, offset });
          }
        });
      });
    });
  });
  return due;
}

// ================= render: CALENDAR =================
function renderCalendar(){
  const el = document.getElementById("calendar-area");
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const todayDate = now.getDate();

  let nextJan1 = new Date(year+1, 0, 1);
  if(now.getMonth()===0 && now.getDate()===1) nextJan1 = new Date(year, 0, 1);
  const msPerDay = 86400000;
  const startOfToday = new Date(year, now.getMonth(), now.getDate());
  const daysLeft = Math.round((nextJan1 - startOfToday) / msPerDay);

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = now.toLocaleDateString("bn-BD", { month: "long", year: "numeric" });
  const weekdayLabels = ["রবি","সোম","মঙ্গল","বুধ","বৃহ","শুক্র","শনি"];

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d === todayDate;
    const isPast = d < todayDate;
    cells += `
      <div class="aspect-square rounded-lg flex flex-col items-center justify-center text-xs relative ${isToday ? 'bg-amber-400 text-slate-950 font-bold' : isPast ? 'bg-slate-900/40 text-slate-600' : 'bg-slate-900/20 text-slate-300'}">
        ${isPast ? '<span class="absolute inset-0 flex items-center justify-center text-rose-500/70 text-lg">✗</span>' : ''}
        <span class="${isPast ? 'opacity-30' : ''}">${bnDigits(d)}</span>
      </div>`;
  }

  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('main')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6 rounded-2xl border border-violet-500/30 bg-violet-500/5 p-5">
      <p class="text-xs text-slate-500 mb-1">১লা জানুয়ারি পর্যন্ত</p>
      <p class="text-3xl font-serif-bn font-bold text-violet-300">আর মাত্র ${bnDigits(daysLeft)} দিন বাকি</p>
    </div>
    <div class="w-full max-w-xl mb-3 text-center">
      <p class="text-sm text-slate-400">${monthName}</p>
    </div>
    <div class="w-full max-w-xl grid grid-cols-7 gap-1.5 mb-2">
      ${weekdayLabels.map(w=>`<div class="text-center text-[10px] text-slate-600 mb-1">${w}</div>`).join("")}
      ${cells}
    </div>
    <p class="text-[11px] text-slate-600 mt-4 text-center max-w-xs">যে তারিখগুলো পার হয়ে গেছে সেখানে ✗ চিহ্ন বসে গেছে — এটা প্রতিদিন নিজে থেকেই আপডেট হয়।</p>
  `;
}

          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="w-full max-w-xl mb-8">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4 flex items-center gap-2">
        <input id="new-subject-name" type="text" placeholder="নতুন সাবজেক্টের নাম (যেমন: বাংলা)" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none" />
        <button onclick="addSubject()" class="px-4 py-2 rounded-full bg-emerald-500 text-slate-950 text-xs font-semibold hover:bg-emerald-400 transition-colors">＋ যোগ</button>
      </div>
    </div>
  `;
}

// ================= render: SUBJECT =================
function renderSubject(){
  const el = document.getElementById("syllabus-area");
  const subj = getSubject(state.currentSubjectId);
  if(!subj){ switchView('syllabus'); return; }

  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('syllabus')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← সিলেবাসে ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-[11px] text-slate-500">${subj.name}</p>
    </div>

    <div class="w-full max-w-xl space-y-4 mb-6">
      ${subj.topics.length===0 ? `<div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4 text-center text-xs text-slate-600">এখনো কোনো টপিক নেই</div>` :
      subj.topics.map(topic => `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4">
          <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-semibold text-amber-300">${topic.name}</p>
            <button onclick="deleteTopic('${subj.id}','${topic.id}')" class="text-slate-600 hover:text-rose-400 text-xs">🗑</button>
          </div>
          <div class="space-y-2 mb-3">
            ${topic.subtopics.length===0 ? `<p class="text-xs text-slate-600">এখনো সাব-টপিক নেই</p>` :
            topic.subtopics.map(st => `
              <div class="flex items-start gap-2 rounded-lg px-3 py-2 bg-slate-950/40">
                <button onclick="toggleSubtopicDone('${subj.id}','${topic.id}','${st.id}')" class="shrink-0 text-base mt-0.5">${st.done ? '✅' : '⚪'}</button>
                <div class="flex-1 min-w-0">
                  <p class="text-sm ${st.done ? 'text-stone-300' : 'text-stone-200'}">${st.name}</p>
                  ${st.completedAt ? `
                    <div class="flex items-center gap-1 mt-1">
                      <span class="text-[9px] text-slate-600">${dateLabel(st.completedAt)} শেষ</span>
                      ${REVISION_OFFSETS.map(o=>`<span class="text-[9px] px-1.5 py-0.5 rounded-full font-semibold ${st.revised[o] ? 'bg-emerald-500/20 text-emerald-400':'bg-slate-800 text-slate-600'}">D${o}</span>`).join("")}
                    </div>` : ''}
                </div>
                <button onclick="deleteSubtopic('${subj.id}','${topic.id}','${st.id}')" class="text-slate-700 hover:text-rose-400 text-xs shrink-0">🗑</button>
              </div>`).join("")}
          </div>
          <div class="flex items-center gap-2">
            <input id="new-subtopic-${topic.id}" type="text" placeholder="নতুন সাব-টপিক" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-stone-200 placeholder-slate-600 outline-none" />
            <button onclick="addSubtopic('${subj.id}','${topic.id}')" class="px-3 py-1.5 rounded-full bg-slate-700 text-stone-200 text-xs hover:bg-slate-600 transition-colors">＋</button>
          </div>
        </div>`).join("")}
    </div>

    <div class="w-full max-w-xl mb-8">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4 flex items-center gap-2">
        <input id="new-topic-name" type="text" placeholder="নতুন টপিকের নাম" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none" />
        <button onclick="addTopic('${subj.id}')" class="px-4 py-2 rounded-full bg-amber-400 text-slate-950 text-xs font-semibold hover:bg-amber-300 transition-colors">＋ টপিক যোগ</button>
      </div>
    </div>
  `;
}

// ================= render: DUA =================
function renderDua(){
  const el = document.getElementById("dua-area");
  el.innerHTML = `
    <div class="w-full max-w-xl mt-2 mb-6 flex items-center gap-3">
      <button onclick="switchView('main')" class="text-slate-400 hover:text-slate-200 text-sm flex items-center gap-1">← ফিরে যাও</button>
    </div>
    <div class="w-full max-w-xl text-center mb-6">
      <p class="uppercase tracking-[0.3em] text-[11px] text-slate-500">🤲 দোয়ার তালিকা</p>
    </div>

    <div class="w-full max-w-xl space-y-3 mb-6">
      ${state.duas.length===0 ? `
        <div class="rounded-2xl border border-slate-800 bg-slate-900/20 p-4 text-center text-xs text-slate-600">এখনো কোনো দোয়া যোগ করা হয়নি — নিচ থেকে যোগ করো</div>` :
        state.duas.map(d => `
          <div class="rounded-2xl border border-rose-500/20 bg-rose-500/5 p-4">
            <div class="flex items-start justify-between gap-2 mb-2">
              <p class="text-sm font-semibold text-rose-300">${d.title}</p>
              <button onclick="deleteDua('${d.id}')" class="text-slate-600 hover:text-rose-400 text-xs shrink-0">🗑</button>
            </div>
            <p class="text-sm text-stone-200 whitespace-pre-line leading-relaxed">${d.text}</p>
          </div>`).join("")}
    </div>

    <div class="w-full max-w-xl mb-8">
      <p class="text-xs text-slate-500 mb-3">নতুন দোয়া যোগ করো</p>
      <div class="rounded-2xl border border-slate-800 bg-slate-900/30 p-4">
        <input id="new-dua-title" type="text" placeholder="দোয়ার শিরোনাম (যেমন: মৃত ব্যক্তির জন্য দোয়া)" class="w-full bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none mb-2" />
        <textarea id="new-dua-text" placeholder="পুরো দোয়ার লেখা এখানে টাইপ করো..." rows="4" class="w-full bg-slate-800/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-stone-200 placeholder-slate-600 outline-none resize-none mb-3"></textarea>
        <button onclick="addDua()" class="w-full py-2.5 rounded-full bg-rose-400 text-slate-950 text-sm font-semibold hover:bg-rose-300 transition-colors">＋ দোয়া যোগ করো</button>
      </div>
    </div>
  `;
}

// ================= init =================
switchView('main');
renderAlarmOverlay();
renderFocusOverlay();

setInterval(() => {
  renderAlarmOverlay();
  renderFocusOverlay();
  if(state.view === 'main') renderMain();
  if(state.view === 'calendar') renderCalendar();
}, 1000);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
